<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Catálogo SIPUCOL</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050300;
      font-family: Arial, sans-serif;
    }

    header {
      height: 48px;
      background: #0f0a00;
      border-bottom: 1px solid #78350f;
      color: #fde68a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      box-sizing: border-box;
    }

    .info {
      display: flex;
      gap: 12px;
      align-items: center;
      min-width: 0;
    }

    #codigo {
      font-weight: bold;
      color: #fbbf24;
    }

    #pagina {
      font-size: 13px;
      color: #fef3c7;
    }

    .acciones {
      display: flex;
      gap: 8px;
    }

    button {
      background: #120c00;
      color: #fcd34d;
      border: 1px solid #78350f;
      border-radius: 7px;
      padding: 7px 10px;
      cursor: pointer;
    }

    iframe {
      width: 100%;
      height: calc(100% - 48px);
      border: 0;
      background: white;
    }
  </style>
</head>

<body>
  <header>
    <div class="info">
      <span id="codigo">Código</span>
      <span id="pagina">Página</span>
    </div>

    <div class="acciones">
      <button id="abrirDirecto">Abrir directo</button>
      <button onclick="window.close()">Cerrar</button>
    </div>
  </header>

  <iframe id="visorPdf" title="Visor PDF SIPUCOL"></iframe>

  <script>
    const params = new URLSearchParams(window.location.search)

    const file = params.get('file') || '/manuals/catalogo-danos.pdf'
    const page = Number(params.get('page') || 1)
    const codigo = params.get('codigo') || 'Código'

    const pdfUrl = `${file}#page=${page}&zoom=page-width`

    document.getElementById('codigo').textContent = codigo
    document.getElementById('pagina').textContent = `Página ${page}`
    document.getElementById('visorPdf').src = pdfUrl

    document.getElementById('abrirDirecto').addEventListener('click', () => {
      window.open(pdfUrl, '_blank', 'noopener,noreferrer')
    })
  </script>
</body>
</html>
