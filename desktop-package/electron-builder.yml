appId: com.sipucol.inspector.desktop
productName: Inspector Sipucol

directories:
  output: release
  buildResources: build

files:
  - main.cjs
  - package.json
  - dist-desktop/**/*

extraResources:
  - from: ../desktop-clean-build/dist/InspectorSipucolBackend
    to: backend-runtime
    filter:
      - "**/*"

asar: true
compression: normal

win:
  executableName: Inspector Sipucol
  icon: build/icon.ico

  target:
    - target: nsis
      arch:
        - x64

    - target: portable
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: Inspector Sipucol
  artifactName: Inspector-Sipucol-Setup-${version}.${ext}

portable:
  artifactName: Inspector-Sipucol-Portable-${version}.${ext}
  requestExecutionLevel: user